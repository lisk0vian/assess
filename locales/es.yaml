      Los grupos son listas de alumnos con nombre ("3B"). Importa una lista de
      clase desde un CSV, empieza un examen para un grupo con
      `ax start <examen> --class 3B` y mira su libro de notas con
      `ax gradebook 3B`.
    example: |-
      ax class import 3B lista-3B.csv
      ax class 3B
      ax class add 3B A-12 B-07
    list_short: Lista los grupos
    none: Todavía no hay grupos. Importa uno con `ax class import <nombre> <archivo.csv>`.
