find:
  short: Busca alumnos, grupos, exámenes y sesiones
  long: |-
    Encuentra lo que se parece al texto, como una búsqueda tolerante: no
    importan mayúsculas, acentos, espacios ni guiones, y se perdona alguna
    errata. Sin texto lista todo lo que pasa los filtros.
      --type      student, class, exam o session (repítelo o sepáralos con comas)
      --class     alumnos de un grupo, sesiones de un grupo
      --exam      sesiones de un examen, alumnos que lo hicieron
      --since     desde una fecha (AAAA-MM-DD)
      --below     una nota por debajo de este porcentaje
      --flagged   alumnos con strikes o señales de integridad
  example: |-
    ax find garcia
    ax find --class 3B --below 50
    ax find --flagged --since 2026-09-01
    ax find algebra --type session --csv
  flag_type: "Solo estos tipos: student, class, exam, session"
  flag_class: Solo este grupo
  flag_exam: Solo este examen (id o título)
  flag_since: Solo desde esta fecha (AAAA-MM-DD)
  flag_below: Solo notas por debajo de este porcentaje
  flag_flagged: Solo alumnos con strikes o señales
  bad_date: "{date} no es una fecha; escríbela como AAAA-MM-DD."
  none: "Nada coincide con «{q}»."
