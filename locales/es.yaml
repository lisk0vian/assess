backup:
  short: Copia de seguridad de toda la bóveda en un archivo
  long: |-
    Copia la bóveda (exámenes, grupos, archivo de sesiones y la base de datos)
    en un único archivo ZIP, por defecto en la carpeta de copias de la bóveda.
    Funciona aunque haya un examen en marcha. La copia de una bóveda cifrada
    sigue cifrada: para restaurarla hace falta la misma contraseña o la clave
    de recuperación.
    También se hace una copia automática cada vez que se cierra una sesión
    (ver el ajuste vault.keep_backups).
  example: |-
    ax backup
    ax backup --out E:\copias\
  flag_out: Archivo o carpeta donde escribir la copia (por defecto la carpeta de copias de la bóveda)
  done: "Copia escrita: {file} ({size})."
  encrypted_note: La copia está cifrada como la bóveda; guarda con ella la contraseña o la clave de recuperación.
  list_short: Lista las copias de la bóveda
  none: Todavía no hay copias.

restore:
  short: Restaura una copia en una carpeta de bóveda nueva
  long: |-
    Descomprime una copia hecha con `ax backup` (o una automática) en una
    carpeta nueva y vacía y la añade a tus bóvedas. La bóveda en uso no se
    toca; para pasar a la restaurada usa --use o `ax vault use`.
  example: ax restore backups/backup-2026-10-25-101500.zip D:\bovedas\restaurada --use
  done: "Restaurada en {dir} como la bóveda «{name}»."
  encrypted_note: Está cifrada; se abre con la contraseña que tenía o con su clave de recuperación.

