      Borra al alumno de la bóveda y, en cada sesión terminada, sus respuestas,
      nota, señales y penalizaciones; el archivo de esas sesiones se reescribe
      sin él. No se puede deshacer. Las copias anteriores aún lo contienen.
    forget_plan: "Esto borra a {who}: {n} sesiones, grupos {classes}."
