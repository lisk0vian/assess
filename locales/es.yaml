    long: Los exámenes guardados en la bóveda, con cuántas veces se ha hecho cada uno. `ax vault add` añade más.
    empty: La bóveda todavía no tiene exámenes; añade una carpeta con `ax vault add <carpeta>`.
    header: "ID\tTítulo\tClave\tSesiones\tÚltima vez"
  exam:
    not_found: "No hay ninguna carpeta llamada {ref} y la bóveda no tiene exámenes."
  start:
