      Muestra un alumno de la bóveda por su identificador: sus grupos y todos
      los exámenes que hizo. Los identificadores son únicos y los nombres se
      pueden repetir; si nada coincide exactamente, eliges entre los más
      parecidos.
      Los alumnos aparecen al entrar en un examen o al añadirlos a un grupo.
