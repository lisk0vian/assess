cli:
  error_prefix: "error:"
  need_terminal: Ejecuta esto en una terminal.
  cancelled: cancelado
  yes_no: "[s/N]"
  no_sessions: todavía no hay sesiones
  no_session: "no hay ninguna sesión \"{id}\""
  root:
    short: Assess — crea, aplica y vigila exámenes desde la terminal
    long: |-
      Assess aplica exámenes en la red del aula: los preparas y vigilas aquí,
      en la terminal, y los alumnos responden desde su navegador sin instalar
      nada.

      Ejecuta `ax` solo para ver el menú. Los ajustes están en
      ~/.config/assess/config.yaml (`ax config`).
  group:
    exam: Exámenes
    session: Sesiones
    setup: Configuración
  usage:
    usage: Uso
    aliases: Alias
    examples: Ejemplos
    commands: Comandos
    more_commands: Otros comandos
    flags: Opciones
    global_flags: Opciones globales
    help_topics: Otros temas de ayuda
    more_info: "Usa \"{{.CommandPath}} [comando] --help\" para ver más sobre un comando."
  help:
    short: Ayuda sobre cualquier comando
    unknown: "No hay ayuda sobre %#q"
  flag:
    data_dir: "carpeta de datos (por defecto: data_dir de los ajustes o la del sistema)"
    config: "archivo de ajustes (por defecto: ax.yaml junto a ax, o ~/.config/assess/config.yaml)"
    help: muestra la ayuda del comando
    version: muestra la versión
    host: "dirección a la que se conectan los alumnos (vacío: todas, se muestra la de la LAN)"
    port: puerto para los alumnos
    join_window: cierra la entrada este tiempo después del inicio (0 la deja abierta)
    allow_public: acepta alumnos de fuera de las redes privadas (detrás de tu propio túnel)
    no_attach: no abrir el panel de la sesión
    json: imprime en JSON
    session: "id de la sesión (por defecto: la más reciente)"
    yes: no pedir confirmación
  version:
    short: Muestra la versión de ax
  new:
    short: "Crea un examen nuevo: con un asistente, o una carpeta desde una plantilla"
    long: |-
      Sin carpeta, new abre un asistente en la terminal que pregunta los datos,
      las preguntas (con vista previa y la respuesta marcada) y la vigilancia, y
      lo comprueba todo antes de escribir la carpeta.

      Con una carpeta, escribe un examen válido con una pregunta de ejemplo de
      cada tipo, listo para editar a mano, con `ax edit` o con una IA (mira
      `ax format`).

      Los valores iniciales (duración, vigilancia...) salen de los ajustes (`ax config`).
    example: |2-
        ax new                                   # asistente
        ax new ./examenes/algebra-01 --title "Álgebra 1"
        ax new quiz --lang en
    no_terminal: el asistente necesita una terminal; indica una carpeta para crearla desde la plantilla
    bad_lang: "\"{lang}\" no es un código de idioma (ejemplos: en, es, pt-BR)"
    created: |
      Creado {dir}
    files: |-
        manifest.yaml            ajustes del examen y orden de las preguntas
        questions/q00N.yaml      un archivo por pregunta
        private/answer-key.yaml  respuestas correctas y puntos (nunca se envían a los alumnos)
        assets/                  imágenes de las preguntas
    next: "\nSiguiente: `ax edit {dir}` para escribir tus preguntas (o edita los archivos y ejecuta `ax validate`)"
    wizard_done: "Creado {dir}. `ax start {q}` lo inicia; `ax edit {q}` lo cambia."
    flag_id: "id del examen (por defecto: sale del nombre de la carpeta)"
    flag_title: título del examen
    flag_lang: "idioma de la página del alumno (en, es...)"
  edit:
    short: "Edita un examen en la terminal: ajustes, preguntas y respuestas"
    long: |-
      Edit abre la carpeta del examen en un editor interactivo. Con formularios
      cambias los ajustes y añades, editas, reordenas y borras preguntas junto
      con sus respuestas; E abre el archivo en tu editor (el ajuste `editor`,
      $VISUAL, $EDITOR, o el Bloc de notas / vi) para todo lo demás. Cada cambio
      se guarda y se valida al momento, y se conservan tus comentarios y el
      formato de los YAML. S inicia el examen.
    example: |2-
        ax edit examples/algebra-01
        EDITOR="code -w" ax edit ./mi-examen
    no_terminal: el editor necesita una terminal; edita los archivos YAML y ejecuta `ax validate`
    flag_duration: "duración del examen al iniciarlo con S (por defecto: la del manifest)"
    saved: "Guardado. `ax start {dir}` lo inicia."
  format:
    short: "Muestra el formato de examen: una guía para escribirlos como archivos y la referencia"
    long: |-
      Format explica cómo escribir un examen como archivos YAML: una guía paso a
      paso con un ejemplo completo y válido y una lista de comprobación (pensada
      para asistentes de IA, legible por cualquiera), seguida de la referencia
      completa. Los profesores pueden usar `ax new` en su lugar.
    flag_guide: muestra solo la guía
    flag_reference: muestra solo la referencia del formato
  admin:
    short: Gestiona la contraseña del panel del profesor
    long: |-
      La contraseña protege `ax attach`, `ax stop` y el panel (que se bloquea solo
      tras unos minutos sin actividad, el ajuste panel.lock_minutes, o con L). No
      cifra la base de datos: cualquiera que use tu cuenta del sistema puede
      leerla, así que bloquea también tu ordenador.
    set_short: Pone o cambia la contraseña del panel
    clear_short: Quita la contraseña del panel
    new_password: "Contraseña nueva: "
    repeat: "Repítela: "
    mismatch: las contraseñas no coinciden
    set_done:
      one: Contraseña guardada. El panel se bloquea tras {n} minuto sin actividad.
      other: Contraseña guardada. El panel se bloquea tras {n} minutos sin actividad.
    cleared: Contraseña quitada.
  attach:
    short: Abre el panel de la sesión en marcha
    start_hint: "inicia una con `ax start <carpeta-del-examen>` o `ax resume`"
    closed: "Panel cerrado. El examen sigue en marcha; `ax attach` lo vuelve a abrir."
    protected: este panel tiene contraseña; ejecuta el comando en una terminal
    password_prompt: "Contraseña del panel: "
    wrong_password: Contraseña incorrecta.
    wrong_password_err: contraseña incorrecta
  start:
    short: Publica un examen e inicia su servidor en segundo plano
    long: |-
      Start valida y publica el examen, abre una sesión en la sala de espera y
      lanza el servidor del examen en segundo plano. Cerrar la terminal o la TUI
      nunca detiene el examen; para eso está `ax stop`.

      El puerto, la dirección y el plazo de entrada salen de los ajustes
      (`ax config`) salvo que los indiques como opciones.
    flag_duration: "duración del examen (por defecto: la del manifest)"
    already_running: "ya hay un examen en marcha ({title}); usa `ax attach` o `ax stop`"
    still_open: "la sesión {code} sigue abierta sin servidor; usa `ax resume` para continuarla o `ax stop` para terminarla"
    running: "Servidor del examen en segundo plano (pid {pid})"
    exam: Examen
    students: Alumnos
    code: Código
    resumed_hint: "La sesión sigue donde estaba; los alumnos se reconectan solos (`ax attach` abre el panel)."
    lobby_hint: "Los alumnos esperan en la sala hasta que empieces el examen (`ax attach` y luego S)."
  status:
    short: Muestra si el servidor del examen está en marcha
    running: "● En marcha  {title}"
    crashed: "✕ Caído  el servidor se detuvo de forma inesperada; las respuestas guardadas están a salvo"
    resume_hint: "Ejecuta `ax resume` para continuar la sesión."
    not_running: "○ Detenido"
    still_open: "La sesión {code} sigue abierta: `ax resume` la continúa, `ax stop` la termina."
    running_left: "en curso · quedan {left}"
    session: Sesión
    code: código
    lobby_counts: "Han entrado {joined} · esperando en la sala"
    counts: "Han entrado {joined} · conectados {online} · respondiendo {active} · entregados {submitted}"
    process: "PID {pid} · activo desde hace {up}"
    last_error: "Último error: {err}"
  stop:
    short: Termina el examen y detiene el servidor (o --suspend para conservar la sesión)
    long: |-
      Stop termina el examen para todos, entrega cada intento con lo guardado y
      detiene el servidor. Con --suspend el servidor se detiene pero la sesión
      sigue abierta, el reloj sigue corriendo y `ax resume` la continúa.
    confirm: ¿Terminar el examen para todos y entregar todos los intentos?
    timeout: "el servidor no se detuvo a tiempo; revisa `ax status`"
    suspended: "Servidor detenido; la sesión sigue abierta. `ax resume` la continúa."
    ended: Examen terminado y servidor detenido. Los resultados están guardados.
    flag_suspend: detiene el servidor pero deja la sesión abierta
  resume:
    short: Vuelve a lanzar el servidor de una sesión que sigue abierta
    already_running: "el servidor del examen ya está en marcha; usa `ax attach`"
    nothing_open: "no hay ninguna sesión abierta que reanudar; usa `ax start <carpeta-del-examen>`"
  logs:
    short: Muestra el registro del servidor del examen
    flag_follow: sigue mostrando las líneas nuevas
    flag_lines: número de líneas que mostrar
    empty: (todavía no hay registro)
  results:
    short: Exporta los resultados de una sesión en CSV o JSON
    long: |-
      Results exporta una fila por alumno: nota, hora de entrega, motivo y los
      puntos de cada pregunta que recibió. Lee la base de datos directamente, así
      que funciona con el servidor en marcha o detenido. Por defecto usa la
      sesión más reciente. El formato, el separador y la marca de orden de bytes
      salen de los ajustes (results.*) salvo que los indiques como opciones.
    example: |2-
        ax results > notas.csv
        ax results --sep ";" --out notas.csv   # Excel en español
        ax results --format json
    bad_format: "formato desconocido \"{format}\" (usa csv o json)"
    bad_sep: --sep debe ser un solo carácter
    wrote:
      one: "Escrita {n} fila en {file}"
      other: "Escritas {n} filas en {file}"
    flag_format: csv o json
    flag_out: escribe en un archivo en vez de en la salida estándar
    flag_sep: separador de campos del CSV
    flag_no_bom: sin la marca de orden de bytes UTF-8
  report:
    short: "Analiza una sesión terminada: notas, preguntas, incidencias e indicios"
    long: |-
      Report abre un análisis interactivo de una sesión terminada: distribución
      de notas y tiempos, cómo se comportó cada pregunta, la línea temporal de
      señales de integridad, parejas de alumnos con respuestas sospechosamente
      parecidas, aciertos justo después de salir del examen y preguntas que se
      volvieron mucho más fáciles que en sesiones anteriores del mismo examen. Un
      indicio no es una prueba: revisa antes de actuar.

      Solo está disponible cuando la sesión ha terminado, y pide la contraseña
      del panel si hay una. Por defecto usa la sesión más reciente.
    example: |2-
        ax report
        ax report --json > informe.json
        ax report > informe.txt   # texto plano fuera de una terminal
    timed_out:
      one: Informe cerrado tras {n} minuto sin actividad.
      other: Informe cerrado tras {n} minutos sin actividad.
    not_ended: "la sesión aún no ha terminado; el informe está disponible al terminar (`ax stop`, o E en el panel)"
  validate:
    short: Comprueba carpetas de examen antes de publicarlas
    long: |-
      Validate comprueba cada archivo de la carpeta del examen contra el formato
      assess/v1: campos desconocidos, ids, referencias, claves de respuestas,
      grupos de preguntas, recursos y límites. Termina con estado 1 si alguna
      carpeta tiene errores.
    flag_strict: los avisos cuentan como errores
    cannot_open: no se puede abrir el examen
    ok: "ok  {name}: {questions} preguntas, {per_attempt} por intento, {points} puntos por intento"
    fail: "FALLO {name}: {errors}, {warnings}"
    errors:
      one: "{n} error"
      other: "{n} errores"
    warnings:
      one: "{n} aviso"
      other: "{n} avisos"
  config:
    short: Muestra y cambia los ajustes
    long: |-
      Los ajustes se guardan en ~/.config/assess/config.yaml, o en ax.yaml junto
      al programa en una copia portátil (ver `ax portable`), o en el archivo que
      indiques con --config. En una terminal, `ax config` abre el panel de
      ajustes: cada ajuste con su valor, de dónde sale y para qué sirve, para
      cambiarlo y guardarlo. `ax config list` los imprime.

      Solo cuenta el archivo (las opciones de la línea de comandos mandan para
      un comando); las variables de entorno nunca se leen. El archivo se
      escribe la primera vez con todos los ajustes comentados; los cambios
      conservan tus comentarios.
    example: |2-
        ax config
        ax config list
        ax config set language es
        ax config set server.port 8080
        ax config info new_exam.proctoring
        ax config reset server.port
        ax config edit
    fix_hint: "Corrige los ajustes con `ax config edit` (o `ax config reset`)."
    file: "Archivo de ajustes: {path}"
    no_file: "  (aún no existe: todos los valores son los de por defecto)"
    empty: (vacío)
    from_file: "archivo, línea {line}"
    from_default: por defecto
    hint: "Cambia un ajuste con `ax config set <clave> <valor>`; `ax config info <clave>` lo explica."
    get_short: Muestra el valor actual de un ajuste
    set_short: Cambia un ajuste en el archivo
    set_done: "{key} = {value}"
    list_short: Imprime cada ajuste con su valor y de dónde sale
    restart_hint: El examen en marcha conserva sus ajustes de servidor; se aplican la próxima vez que arranque (ax stop --suspend y luego ax resume).
    reset_short: Devuelve un ajuste, o el archivo entero, a los valores por defecto
    reset_long: |-
      Con una clave, reset vuelve a comentar ese ajuste para que se use su valor
      por defecto. Sin clave, escribe un archivo nuevo con todo comentado; el
      anterior se guarda al lado como config.yaml.bak.
    reset_key: "{key} vuelve a su valor por defecto ({value})"
    reset_confirm: ¿Reemplazar el archivo de ajustes por uno nuevo (el actual se guarda como copia)?
    reset_all: "Ajustes restablecidos. El archivo anterior está en {backup}."
    edit_short: Abre el archivo de ajustes en tu editor y lo comprueba al cerrarlo
    edit_long: |-
      Edit abre el archivo de ajustes con el ajuste `editor`, $VISUAL, $EDITOR, o
      el Bloc de notas / vi. Al cerrarlo se comprueba; si algo está mal ves cada
      problema con su línea y puedes volver a abrirlo.
    edit_ok: Ajustes guardados y correctos.
    edit_again: ¿Volver a abrir el archivo para corregirlo?
    path_short: Muestra dónde está el archivo de ajustes
    info_short: Explica un ajuste
    info_value: Actual
    info_default: Defecto

    info_change: Cambiar
    kind:
      text: texto
      number: número
      bool: true|false
      duration: duración
      choice: valor
    unknown_key: "ajuste desconocido \"{key}\" (`ax config` los lista)"
    saved:
      one: "Guardado {n} cambio en {path}."
      other: "Guardados {n} cambios en {path}."
  i18n:
    short: Traducciones de la interfaz
    long: |-
      La interfaz (terminal y página del alumno) se traduce con catálogos, un
      archivo YAML por idioma. Inglés y español vienen incluidos; puedes añadir
      más en ~/.config/assess/locales/. Lo que falte se muestra en inglés.
    list_short: Lista los idiomas disponibles y lo completos que están
    check_short: Lista los textos que faltan o están mal en las traducciones
    problems:
      one: "{n} problema."
      other: "{n} problemas."
    complete: Todas las traducciones están completas.
    new_short: Muestra un catálogo para empezar una traducción nueva
    new_long: |-
      New muestra el catálogo en inglés. Guárdalo como <idioma>.yaml en
      ~/.config/assess/locales/, traduce los valores (deja igual las claves y los
      marcadores entre llaves) y elígelo con `ax config set language <idioma>`. Para
      compartirlo con todos, envíalo al proyecto como locales/<idioma>.yaml.

