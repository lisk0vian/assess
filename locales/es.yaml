config:
  file_header: |-
    Ajustes de Assess (ax). Todos los ajustes de abajo están comentados y
    usan su valor por defecto. Para cambiar uno, quita el "# " de delante o
    ejecuta:
      ax config set <clave> <valor>    por ejemplo: ax config set server.port 8080
    `ax config` abre el panel de ajustes; `ax config list` imprime todos con
    su valor actual. Las opciones de la línea de comandos mandan sobre este
    archivo. Las variables de entorno nunca se leen. Cada examen conserva lo
    que diga su propio manifest.
  group:
    server: Servidor del examen (ax start)
    new_exam: Valores iniciales de los exámenes nuevos (ax new); los existentes no cambian
    panel: Panel de la sesión
    results: Exportación de resultados (ax results)
    vault: Bóveda (exámenes, grupos y resultados de este ordenador)
  key:
    language: Idioma de la terminal (menús, panel, informes, ayuda).
    student_language: |-
      Idioma de la página del alumno cuando el examen no indica ninguno.
      Vacío: el mismo que language.
    data_dir: Carpeta de la base de datos, los registros y el estado del servidor. Vacío usa la del sistema.
    editor: |-
      Programa con el que el editor abre archivos (E). Vacío usa $VISUAL,
      $EDITOR, o el Bloc de notas / vi.
    server.port: Puerto al que se conectan los alumnos. Si está ocupado, se usa el siguiente libre.
    server.host: Dirección a la que se conectan los alumnos. Vacío escucha en todas y muestra la de la LAN.
    server.join_window: Cuánto tiempo después del inicio pueden entrar los alumnos por su cuenta (0 lo deja abierto).
    server.late_answers: Cuánto tiempo después del final se aceptan respuestas que los alumnos aún estaban enviando.
    server.allow_public: Aceptar alumnos de fuera de las redes privadas (solo detrás de tu propio túnel).
    new_exam.duration: Duración de un examen nuevo.
    new_exam.result_visibility: Qué ven los alumnos al entregar.
    new_exam.proctoring: Perfil anti-trampa.
    new_exam.shuffle_questions: Barajar el orden de las preguntas para cada alumno.
    new_exam.shuffle_options: Barajar las opciones de cada pregunta.
    new_exam.instructions: Instrucciones que se muestran antes de empezar.
    panel.lock_minutes: Minutos sin actividad antes de bloquear el panel con contraseña (0 nunca).
    results.format: Formato de `ax results`.
    results.separator: Separador de campos del CSV. Usa ";" para Excel en español.
    results.bom: Empezar los CSV con una marca de orden de bytes, para que Excel lea bien los acentos.
    vault.path: |-
      Bóveda que se usa, por nombre (ver `ax vault list`) o carpeta. Vacío usa
      la de la carpeta de datos. Una carpeta .assess-vault en la carpeta
      actual o en una superior tiene prioridad.
    vault.encrypt: Cifrar con contraseña las bóvedas nuevas (ax vault init).
    vault.unlock_minutes: Minutos que una bóveda cifrada queda abierta tras escribir la contraseña (0 la pide siempre).
    vault.keep_backups: Copias automáticas que se conservan (se hace una al cerrar cada sesión; 0 no hace ninguna).

