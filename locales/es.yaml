vault:
  group: Bóveda
  flag: Bóveda para este comando (nombre o carpeta)
  password_prompt: "Contraseña de la bóveda «{name}»: "
  wrong_password: Contraseña incorrecta.
  wrong_password_err: Contraseña incorrecta tres veces.
  locked_no_terminal: "La bóveda «{name}» está cifrada y cerrada; ejecuta antes `ax vault unlock` en una terminal."
  agent_failed: "La bóveda no pudo quedarse abierta en segundo plano ({err}); se te volverá a pedir."
  new_password: "Contraseña nueva: "
  repeat_password: "Repítela: "
  short_password: "La contraseña necesita al menos {n} caracteres."
  mismatch: No coinciden; prueba otra vez.
  no_password: No se puso ninguna contraseña.
  busy: Hay un examen en marcha con esta bóveda; detenlo antes (ax stop --suspend lo deja abierto).
  cmd:
    short: Gestiona las bóvedas, donde se guardan exámenes, grupos y resultados
    long: |-
      Una bóveda es una carpeta que reúne tus exámenes, grupos, el archivo de
      sesiones, las copias de seguridad y la base de datos, para que puedas
      llevarla a otro ordenador. Se cifra con tu contraseña salvo que elijas
      no hacerlo. Sin subcomando, muestra la bóveda en uso.

      La bóveda en uso es, por orden: --vault, una carpeta .assess-vault aquí o
      en una carpeta superior, el ajuste vault.path (`ax vault use`) o la de
      la carpeta de datos.
  state:
    plain: sin cifrar
    open: cifrada, abierta
    locked: cifrada, cerrada
    missing: carpeta no encontrada
  source:
    flag: la opción --vault
    folder: la carpeta .assess-vault de la carpeta actual
    setting: el ajuste vault.path
    default: la bóveda por defecto
  info:
    name: "Bóveda:     "
    folder: "Carpeta:    "
    chosen: "Elegida por:"
    state: "Estado:     "
    exams: "Exámenes:   "
    sessions: "Sesiones:   "
    classes: "Grupos:     "
    students: "Alumnos:    "
    backup: "Copia:      "
    no_backup: todavía ninguna (ax backup)
    plain_hint: Esta bóveda no está cifrada; cualquiera que lea este disco puede leerla. `ax vault encrypt` la protege con contraseña.
  init:
    short: Crea una bóveda
    long: |-
      Crea una bóveda en una carpeta (por defecto .assess-vault en la carpeta
      actual, que ax usa siempre que trabajes aquí o más abajo). Se cifra con
      contraseña salvo que --no-encrypt o el ajuste vault.encrypt digan lo
      contrario; además recibes una clave de recuperación, que se muestra una
      sola vez.
      Si olvidas la contraseña y pierdes la clave de recuperación, crea otra
      bóveda y sigue: la antigua nunca se toca.
    example: |-
      ax vault init
      ax vault init D:\colegio --name colegio --use
      ax vault init --no-encrypt
    flag_name: Nombre de la bóveda (por defecto el de la carpeta)
    flag_no_encrypt: No cifrarla
    flag_use: Usarla a partir de ahora
    need_terminal: Para poner una contraseña hace falta una terminal.
    password_intro: Elige la contraseña de la bóveda. Protege exámenes, grupos y resultados en este disco.
    done: "Creada la bóveda «{name}» en {dir}."
    plain: No está cifrada; `ax vault encrypt` le pone contraseña después.
    local_hint: ax la usa siempre que trabajes en esta carpeta o más abajo.
    use_hint: "Úsala con `ax vault use {name}`, o con --vault {name}."
  recovery:
    title: "Clave de recuperación. Apúntala o imprímela, y guárdala lejos de este ordenador:"
    body: |-
      Abre la bóveda si olvidas la contraseña (`ax vault passwd --recovery`).
      Solo se muestra ahora.
    enter: "Pulsa Intro cuando la tengas guardada… "
  list:
    short: Lista las bóvedas
    header: "  Nombre\tEstado\tCarpeta"
  use:
    short: Elige la bóveda en uso
    long: Guarda el nombre de la bóveda en el ajuste vault.path. Una carpeta .assess-vault en la carpeta actual sigue teniendo prioridad.
    done: "Usando la bóveda «{name}»."
    env_wins: AX_VAULT_PATH está definida y manda sobre el ajuste.
  forget:
    short: Quita una bóveda de la lista (su carpeta se queda)
    unknown: "No hay ninguna bóveda llamada {name}."
    done: "Olvidada «{name}»; su carpeta {dir} queda intacta."
  lock:
    short: Cierra la bóveda ahora
    done: La bóveda está cerrada; el próximo comando pedirá la contraseña.
  unlock:
    short: Abre la bóveda durante un rato
    done:
      one: "La bóveda queda abierta {n} minuto."
      other: "La bóveda queda abierta {n} minutos."
  encrypt:
    short: Cifra la bóveda con una contraseña
    long: |-
      Cifra todos los archivos de la bóveda y las columnas sensibles de su base
      de datos (contenido y claves de los exámenes, nombres e identificadores,
      respuestas). No se pierde nada. Si se interrumpe, vuelve a ejecutarlo
      para terminar.
    done: "La bóveda «{name}» está cifrada."
    backups_hint: Las copias hechas antes siguen sin cifrar; bórralas si importa (ax backup list).
  decrypt:
    short: Quita el cifrado de la bóveda
    long: Escribe todos los archivos y la base de datos en claro. Cualquiera que lea este disco podrá leerlos.
    confirm: ¿Quitar el cifrado? Cualquiera que lea este disco podrá leer la bóveda
    done: "La bóveda «{name}» ya no está cifrada."
  passwd:
    short: Cambia la contraseña de la bóveda
    long: |-
      Pide la contraseña actual (o, con --recovery, la clave de recuperación)
      y una nueva. Los datos no cambian: solo se vuelve a envolver la clave.
    flag_recovery: Usar la clave de recuperación en vez de la contraseña actual
    recovery_prompt: "Clave de recuperación: "
    plain: Esta bóveda no está cifrada; `ax vault encrypt` le pone contraseña.
    done: Contraseña cambiada.
  add:
    short: Guarda exámenes en la bóveda
    long: |-
      Empaqueta una carpeta de examen (o lee un paquete .examx) en la bóveda,
      después de comprobarlo. Luego ofrece borrar la carpeta original: la
      bóveda conserva el examen, y `ax edit <id>` o `ax vault export` lo
      devuelven.
    example: |-
      ax vault add algebra-01
      ax vault add compartido.examx
    flag_force: Sustituir un examen con el mismo id
    flag_delete: Borrar las carpetas originales sin preguntar
    flag_keep: Conservar las carpetas originales sin preguntar
    no_id: "{dir} no tiene id de examen en su manifest."
    exists: "La bóveda ya tiene un examen llamado {id}; --force lo sustituye."
    passphrase: "Frase de paso del paquete: "
    invalid:
      one: "El examen tiene {n} problema; revísalo con `ax validate`."
      other: "El examen tiene {n} problemas; revísalo con `ax validate`."
    done: "Guardado «{title}» ({id}) en la bóveda «{name}»."
    delete_original: "¿Borrar la carpeta {dir}? La bóveda conserva el examen"
    deleted: "Borrada {dir}."
  export:
    short: Saca un examen de la bóveda
    long: |-
      Escribe un examen de la bóveda como paquete .examx para compartir, o
      como carpeta (--folder). Un paquete con la clave de respuestas se cifra
      con una frase de paso que eliges; --no-key deja la clave fuera.
    example: |-
      ax vault export algebra-01
      ax vault export algebra-01 --no-key -o algebra-para-colegas.examx
      ax vault export algebra-01 --folder algebra-01
    flag_out: Archivo del paquete (por defecto <id>.examx)
    flag_folder: Escribe una carpeta en vez de un paquete
    flag_no_key: Deja fuera la clave de respuestas
    flag_no_encrypt: No cifrar un paquete que lleva la clave de respuestas
    need_terminal: Para elegir una frase de paso hace falta una terminal (o usa --no-key).
    passphrase_intro: Elige una frase de paso para el paquete; quien lo importe la necesitará.
    plain_warning: "Aviso: el paquete lleva la clave de respuestas y no está cifrado."
    exists: "{file} ya existe."
    done: "Escrito {file}."
    folder_done: "Escrita la carpeta {dir}."
  exams:
    short: Lista los exámenes de la bóveda
    long: Los exámenes guardados en la bóveda, con cuántas veces se ha hecho cada uno. `ax vault add` añade más.
    empty: La bóveda todavía no tiene exámenes; añade una carpeta con `ax vault add <carpeta>`.
    header: "ID\tTítulo\tClave\tSesiones\tÚltima vez"
  exam:
    not_found: "No hay ninguna carpeta llamada {ref} y la bóveda no tiene exámenes."
  start:
    example: |-
      ax start algebra-01
      ax start ./algebra-01 --class 3B
      ax start algebra-01 --class 3B --roster-only
    flag_class: El grupo que hace el examen (sus alumnos quedan apuntados antes de entrar)
    flag_roster_only: Solo entran los alumnos del grupo; cualquier otro espera tu aprobación
    roster_needs_class: --roster-only necesita --class.
  edit:
    saved: "Guardado en la bóveda «{name}»."
  new:
    saved: "También guardado en la bóveda «{name}»."
  migrate:
    running: Sigue en marcha un examen empezado con una versión anterior de ax; detenlo (ax stop) y vuelve a ejecutar este comando.
    done: "Tus datos han pasado a la bóveda {dir} ({n} sesiones terminadas archivadas). La base de datos antigua se guarda en {copy}."
    archive_failed: "Algunas sesiones no se pudieron archivar: {err}"
