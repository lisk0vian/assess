    Construye el libro de notas de un grupo: una fila por alumno, una columna
    por examen que hizo (el último intento, en porcentaje) y su media.
    Muestra una tabla, o escribe un CSV o un libro de Excel (.xlsx).
  example: |-
    ax gradebook 3B
    ax gradebook 3B --out 3B.xlsx
    ax gradebook 3B --csv > 3B.csv
  flag_xlsx: Escribe un libro de Excel (necesita --out)
