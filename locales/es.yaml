    delete_confirm: "¿Borrar el grupo {class}? Sus alumnos siguen en la bóveda"
    deleted: "Borrado el grupo {class}."
    add_short: Mete alumnos en un grupo
    added: "Añadidos {n} a {class} ({already} ya estaban)."
    added_one: "{id} está en {class}."
    remove_short: Saca alumnos de un grupo
    removed: "Sacados {n} de {class}."
    export_short: Escribe la lista de un grupo en CSV
    exported: "Escritos {n} alumnos en {file}."
    import_short: Importa una lista de clase desde un CSV
    import_long: |-
      Lee una hoja de cálculo guardada como CSV: una columna con el
      identificador y otra con el nombre (o nombre y apellidos). Se detectan el
      separador (, ; o tabulador) y la codificación (UTF-8 o la Windows-1252 de
      Excel). Ves una vista previa y los duplicados antes de guardar nada. El
      grupo se crea si no existe.
    import_example: ax class import 3B lista-3B.csv
