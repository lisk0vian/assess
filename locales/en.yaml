    long: |-
      A vault is a folder that keeps your exams, classes, session archives,
      backups and the database together, so you can copy it to another
      computer. It is encrypted with your password unless you choose not to.
      Without a subcommand, shows the vault in use.

      The vault in use is, in order: --vault, a .assess-vault folder here or in
      a parent folder, the vault.path setting (`ax vault use`), or the default
      one in the data folder.
  state:
    plain: not encrypted
