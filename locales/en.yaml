config:
  file_header: |-
    Assess settings (ax). Every setting below is commented out and uses its
    default. To change one, remove the "# " in front of it, or run:
      ax config set <key> <value>      for example: ax config set server.port 8080
    `ax config` lists every setting with its current value and where it
    comes from. Command-line flags and AX_* environment variables win over
    this file. Exams always keep what their own manifest says.
  group:
    server: Exam server (ax start)
    new_exam: Starting values for new exams (ax new); existing exams are not changed
    panel: Session panel
    results: Results export (ax results)
  key:
    language: Language of the terminal (menus, panel, reports, help).
    student_language: |-
      Language of the student web page when an exam does not set one.
      Empty: the same as language.
    data_dir: Folder for the database, logs and server state. Empty uses the system's default.
    editor: |-
      Command that opens files from the editor (E). Empty uses $VISUAL,
      $EDITOR, or Notepad / vi.
    server.port: Port students connect to. If it is busy, the next free one is used.
    server.host: Address students connect to. Empty listens everywhere and shows the LAN address.
    server.join_window: How long after the start students may still join on their own (0 keeps it open).
    server.late_answers: How long after the deadline answers still sent by students are accepted.
    server.allow_public: Accept students from outside private networks (only behind your own tunnel).
    new_exam.duration: Duration of a new exam.
    new_exam.result_visibility: What students see after submitting.
    new_exam.proctoring: Anti-cheating profile.
    new_exam.shuffle_questions: Shuffle the order of the questions for each student.
    new_exam.shuffle_options: Shuffle the options of each question.
    new_exam.instructions: Instructions shown before the exam starts.
    panel.lock_minutes: Minutes without activity before a password-protected panel locks (0 never).
    results.format: Format of `ax results`.
    results.separator: CSV field separator. Use ";" for Excel in many European languages.
    results.bom: Start CSV files with a byte order mark, so Excel reads accents correctly.

state:
  lobby: in the lobby
  running: running
  ended: ended

home:
  idle: No exam is running.
  crashed: "The server stopped before the exam ended: you can resume it and nobody loses their answers."
  open: There is an open session without a server.
  question: What do you want to do?
  resume: "Resume «{title}» (session {code}, no server)"
  edit: Edit an exam
  new: Create a new exam, step by step
  start: Start an exam
  report: "Report of the last session («{title}», {code})"
  settings: Settings
  quit: Quit
  pick_edit: Which exam do you want to edit?
  pick_start: Which exam do you want to start?
  other_folder: Another folder…
  folder_hint: Path of the exam folder (the one with manifest.yaml).
  no_manifest: There is no manifest.yaml there.

cli:
  error_prefix: "error:"
  need_terminal: Run this in a terminal.
  cancelled: cancelled
  yes_no: "[y/N]"
  no_sessions: there are no sessions yet
  no_session: "no session \"{id}\""
  root:
    short: Assess — create, run and proctor exams from the terminal
    long: |-
      Assess runs exams in a classroom network: you prepare and supervise them
      here, in the terminal, and students answer from their browsers without
      installing anything.

      Run `ax` alone for the menu. Settings live in ~/.config/assess/config.yaml
      (`ax config`).
  group:
    exam: Exams
    session: Sessions
    setup: Setup
  usage:
    usage: Usage
    aliases: Aliases
    examples: Examples
    commands: Commands
    more_commands: Additional commands
    flags: Flags
    global_flags: Global flags
    help_topics: Additional help topics
    more_info: "Use \"{{.CommandPath}} [command] --help\" for more information about a command."
  help:
    short: Help about any command
    unknown: "Unknown help topic %#q"
  flag:
    data_dir: "data directory (default: data_dir in the settings, $AX_DATA_DIR or the system's)"
    config: "settings file (default: $AX_CONFIG or ~/.config/assess/config.yaml)"
    help: show help for the command
    version: show the version
    host: "address students connect to (empty: all interfaces, LAN address shown)"
    port: port for students
    join_window: close joining this long after the start (0 keeps it open)
    allow_public: accept students from outside private networks (behind your own tunnel)
    no_attach: do not open the session panel
    json: print as JSON
    session: "session id (default: the most recent)"
    yes: do not ask for confirmation
  version:
    short: Print the ax version
  new:
    short: "Create a new exam: a guided wizard, or a folder from a template"
    long: |-
      Without a folder, new opens a wizard in the terminal that asks for the
      details, the questions (with a live preview and the answer marked), how it
      is proctored, and checks everything before writing the folder.

      With a folder, it writes a valid exam with one sample question of each type,
      ready to edit by hand, with `ax edit`, or by an AI (see `ax format`).

      Starting values (duration, proctoring...) come from the settings (`ax config`).
    example: |2-
        ax new                                   # wizard
        ax new ./exams/algebra-01 --title "Algebra 1"
        ax new quiz --lang es
    no_terminal: the wizard needs a terminal; pass a folder to create one from the template
    bad_lang: "\"{lang}\" is not a language code (examples: en, es, pt-BR)"
    created: |
      Created {dir}
    files: |-
        manifest.yaml            exam settings and question order
        questions/q00N.yaml      one file per question
        private/answer-key.yaml  correct answers and points (never sent to students)
        assets/                  images used in questions
    next: "\nNext: `ax edit {dir}` to write your questions (or edit the files and run `ax validate`)"
    wizard_done: "Created {dir}. `ax start {q}` runs it; `ax edit {q}` changes it."
    flag_id: "exam id (default: derived from the folder name)"
    flag_title: exam title
    flag_lang: "student page language (en, es...)"
  edit:
    short: "Edit an exam in the terminal: settings, questions and answers"
    long: |-
      Edit opens the exam folder in an interactive editor. Forms change the
      settings, add, edit, reorder and delete questions together with their
      answers; E opens the file in your editor (the `editor` setting, $VISUAL,
      $EDITOR, or Notepad / vi) for anything else. Every change is saved and
      validated at once, and your comments and layout in the YAML files are
      kept. S starts the exam.
    example: |2-
        ax edit examples/algebra-01
        EDITOR="code -w" ax edit ./my-exam
    no_terminal: the editor needs a terminal; edit the YAML files and run `ax validate`
    flag_duration: "exam duration when started with S (default: the manifest's)"
    saved: "Saved. `ax start {dir}` runs it."
  format:
    short: "Print the exam format: a guide to writing exams as files, and the reference"
    long: |-
      Format prints how to write an exam as YAML files: a step-by-step guide with a
      complete, valid example and a checklist (made for AI assistants, readable by
      anyone), followed by the full reference. Teachers can use `ax new` instead.
    flag_guide: print only the authoring guide
    flag_reference: print only the format reference
  admin:
    short: Manage the teacher panel password
    long: |-
      The password protects `ax attach`, `ax stop` and the panel (which locks itself
      after a few idle minutes, the panel.lock_minutes setting, or with L). It does
      not encrypt the database: anyone using your OS account can read it, so lock
      your computer too.
    set_short: Set or change the panel password
    clear_short: Remove the panel password
    new_password: "New password: "
    repeat: "Repeat it: "
    mismatch: the passwords do not match
    set_done:
      one: Password set. The panel now locks after {n} idle minute.
      other: Password set. The panel now locks after {n} idle minutes.
    cleared: Password removed.
  attach:
    short: Open the panel of the running session
    start_hint: "start one with `ax start <exam-folder>` or `ax resume`"
    closed: "Panel closed. The exam keeps running; `ax attach` reopens it."
    protected: this panel is password protected; run the command in a terminal
    password_prompt: "Panel password: "
    wrong_password: Wrong password.
    wrong_password_err: wrong password
  start:
    short: Publish an exam and start its session server in the background
    long: |-
      Start validates and publishes the exam, opens a session in the lobby and
      launches the exam server in the background. Closing the terminal or the
      TUI never stops the exam; use `ax stop` for that.

      Port, address and joining window come from the settings (`ax config`)
      unless given as flags.
    flag_duration: "exam duration (default: the manifest's)"
    already_running: "an exam is already running ({title}); use `ax attach` or `ax stop`"
    still_open: "session {code} is still open without a server; use `ax resume` to continue it or `ax stop` to end it"
    running: "Exam server running in the background (pid {pid})"
    exam: Exam
    students: Students
    code: Code
    resumed_hint: "The session continues where it was; students reconnect on their own (`ax attach` opens the panel)."
    lobby_hint: "Students wait in the lobby until you start the exam (`ax attach`, then S)."
  status:
    short: Show whether the exam server is running
    running: "● Running  {title}"
    crashed: "✕ Crashed  the exam server stopped unexpectedly; answers saved so far are safe"
    resume_hint: "Run `ax resume` to continue the session."
    not_running: "○ Not running"
    still_open: "Session {code} is still open: `ax resume` continues it, `ax stop` ends it."
    running_left: "running · {left} left"
    session: Session
    code: code
    lobby_counts: "Joined {joined} · waiting in the lobby"
    counts: "Joined {joined} · online {online} · answering {active} · submitted {submitted}"
    process: "PID {pid} · up {up}"
    last_error: "Last error: {err}"
  stop:
    short: End the exam and stop the server (or --suspend to keep the session)
    long: |-
      Stop ends the exam for everyone, submits every attempt with what is saved
      and stops the server. With --suspend the server stops but the session stays
      open, the clock keeps running, and `ax resume` continues it.
    confirm: End the exam for everyone and submit all attempts?
    timeout: "the server did not stop in time; check `ax status`"
    suspended: "Server stopped; the session stays open. `ax resume` continues it."
    ended: Exam ended and server stopped. Results are saved.
    flag_suspend: stop the server but keep the session open
  resume:
    short: Restart the server for a session that is still open
    already_running: "the exam server is already running; use `ax attach`"
    nothing_open: "there is no open session to resume; use `ax start <exam-folder>`"
  logs:
    short: Show the exam server log
    flag_follow: keep printing new lines
    flag_lines: number of lines to show
    empty: (no log yet)
  results:
    short: Export the results of a session as CSV or JSON
    long: |-
      Results exports one row per student: score, submission time, reason and
      the points of every question they received. It reads the database directly,
      so it works while the server runs or after it stopped. Defaults to the most
      recent session. Format, separator and byte order mark come from the
      settings (results.*) unless given as flags.
    example: |2-
        ax results > grades.csv
        ax results --sep ";" --out grades.csv   # Excel in many European languages
        ax results --format json
    bad_format: "unknown format \"{format}\" (use csv or json)"
    bad_sep: --sep must be a single character
    wrote:
      one: "Wrote {n} row to {file}"
      other: "Wrote {n} rows to {file}"
    flag_format: csv or json
    flag_out: write to a file instead of stdout
    flag_sep: CSV field separator
    flag_no_bom: omit the UTF-8 byte order mark
  report:
    short: "Analyse a finished session: grades, questions, incidents and evidence"
    long: |-
      Report opens an interactive analysis of a finished session: score and time
      distributions, how each question behaved, the timeline of integrity signals,
      pairs of students with suspiciously similar answers, correct answers given
      right after leaving the exam, and questions that became much easier than in
      earlier sessions of the same exam. Evidence is not proof: review before acting.

      It is only available once the session has ended, and asks for the panel
      password if one is set. Defaults to the most recent session.
    example: |2-
        ax report
        ax report --json > report.json
        ax report > report.txt   # plain text when not a terminal
    timed_out:
      one: Report closed after {n} idle minute.
      other: Report closed after {n} idle minutes.
    not_ended: "the session has not ended yet; the report is available once it ends (`ax stop`, or E in the panel)"
  validate:
    short: Check exam folders for errors before publishing them
    long: |-
      Validate checks every file of an exam folder against the assess/v1 format:
      unknown fields, ids, references, answer keys, pools, assets and limits.
      It exits with status 1 when any folder has errors.
    flag_strict: treat warnings as errors
    cannot_open: cannot open exam
    ok: "ok  {name}: {questions} questions, {per_attempt} per attempt, {points} points per attempt"
    fail: "FAIL {name}: {errors}, {warnings}"
    errors:
      one: "{n} error"
      other: "{n} errors"
    warnings:
      one: "{n} warning"
      other: "{n} warnings"
  config:
    short: Show and change the settings
    long: |-
      Settings are kept in ~/.config/assess/config.yaml (or $AX_CONFIG, or
      --config). Without a subcommand, config lists every setting with its
      current value and where it comes from: the file (with its line), an AX_*
      environment variable, or the built-in default.

      Command-line flags win over the environment, which wins over the file.
      The file is written on the first run with every setting commented out;
      `ax config set` changes one line and keeps your comments.
    example: |2-
        ax config
        ax config set language es
        ax config set server.port 8080
        ax config info new_exam.proctoring
        ax config reset server.port
        ax config edit
    fix_hint: "Fix the settings with `ax config edit` (or `ax config reset`)."
    file: "Settings file: {path}"
    no_file: "  (not created yet: every value is the default)"
    empty: (empty)
    from_file: "file, line {line}"
    from_default: default
    hint: "Change a setting with `ax config set <key> <value>`; `ax config info <key>` explains it."
    get_short: Print the current value of a setting
    set_short: Change a setting in the file
    set_done: "{key} = {value}"
    env_wins: "Note: ${env} is set and wins over the file."
    reset_short: Put one setting, or the whole file, back to the defaults
    reset_long: |-
      With a key, reset comments that setting out again so its default applies.
      Without one, it writes a fresh file with every setting commented out; the
      old file is kept next to it as config.yaml.bak.
    reset_key: "{key} is back to its default ({value})"
    reset_confirm: Replace the settings file with a fresh one (the current one is kept as a backup)?
    reset_all: "Settings reset. The previous file is in {backup}."
    edit_short: Open the settings file in your editor and check it on close
    edit_long: |-
      Edit opens the settings file in the `editor` setting, $VISUAL, $EDITOR, or
      Notepad / vi. When you close it, the file is checked; if something is wrong
      you see each problem with its line and can open it again.
    edit_ok: Settings saved and valid.
    edit_again: Open the file again to fix it?
    path_short: Print where the settings file is
    info_short: Explain a setting
    info_value: Current
    info_default: Default
    info_env: Variable
    info_change: Change
    kind:
      text: text
      number: number
      bool: true|false
      duration: duration
      choice: value
    unknown_key: "unknown setting \"{key}\" (`ax config` lists them)"
    saved:
      one: "Saved {n} change in {path}."
      other: "Saved {n} changes in {path}."
  i18n:
    short: Translations of the interface
    long: |-
      The interface (terminal and student page) is translated with catalogs, one
      YAML file per language. English and Spanish are built in; more can be put
      in ~/.config/assess/locales/. Missing texts are shown in English.
    list_short: List the available languages and how complete they are
