firewall:
  short: Check that students can reach this computer, and open the port once
  long: |-
    On Windows, a program that receives connections needs a firewall rule,
    and creating one needs an administrator: that is the window Windows shows
    the first time ax starts an exam. `ax firewall` checks, without any
    special rights, whether the rule is there and which networks it covers.

    The rule ax uses is by port, not by program: once it exists, every copy
    of ax works, from any folder or USB stick and in any future version, so
    an administrator only has to act once per computer:
      ax firewall setup     asks for the administrator's password (a Windows window) and opens the port
      ax firewall script    writes a script and a note for your IT staff (also usable as a group policy)
      ax firewall remove    takes the rule away again
  check_short: Show whether students can reach ax on each network
  setup_short: Open the student port in the Windows firewall (asks for an administrator once)
  remove_short: Remove the firewall rule
  setup_long: |-
    Creates the inbound rule «Assess (ax)» for TCP ports of server.port and
    the next ones the server may use when one is busy, on domain and private
    networks (--public adds public ones). When ax is not running as
    administrator, Windows asks for the administrator's password in its own
    window; nobody needs to stay afterwards.
  script_short: Write a script and a note for IT that open the port
  script_long: |-
    Writes assess-firewall.cmd (run it as administrator, or deploy it to
    every classroom computer as a group policy) and a short note explaining
    what it opens and why.
  flag_public: Also on networks Windows calls public (not recommended outside the school)
  not_windows: No step is needed on this system; ports above 1024 accept connections without special rights.
  profile:
    Public: public
    Private: private
    DomainAuthenticated: domain
  covered: open for students
  not_covered: closed (Windows blocks students)
  blocked: blocked by a rule (a Windows prompt was cancelled)
  app_only: "Students can reach this copy of ax, through the rule Windows made for its folder. A copy in another folder or USB stick will ask for an administrator again; `ax firewall setup` opens the port once for every copy."
  no_network: No connected network.
  ready: "Students can reach this computer (TCP ports {ports} are open)."
  rule_partial: "The rule for TCP {ports} exists, but not for every connected network: a network marked as public stays closed. Ask for it to be marked private, or run `ax firewall setup --public`."
  no_rule: "Windows will keep students out: there is no rule for TCP {ports}."
  options: |-
    What you can do:
      1. Once per computer, with an administrator: `ax firewall setup` (Windows asks for the password; then it is never needed again, whatever folder ax is in).
      2. Without waiting for anyone: hand your IT staff the files of `ax firewall script`, ideally to apply to every classroom computer.
      3. Meanwhile, run ax on a computer where you are the administrator (your own laptop): copy it with `ax portable init <folder> --copy-vault`.
    docs/classroom-network.md explains each one.
  start_hint: "Note: Windows may block students on this computer (no firewall rule for ax). `ax firewall` explains how to open it once."
  elevating: Windows will ask for an administrator's password in a window of its own…
  elevate_failed: "The rule was not created ({err}). Without an administrator, try `ax firewall script` for IT."
  done: "Done: TCP {ports} is open for students. It works for every copy of ax on this computer."
  public_hint: A connected network is marked public and stays closed; `ax firewall setup --public` opens it too.
  removed: The firewall rule is gone.
  not_applied: The firewall did not change (the administrator window may have been cancelled).
  readme_file: README-IT.txt
  readme: |-
    Assess (ax) runs exams in the classroom: the teacher's computer serves a
    web page that students open from their own devices on the school network.
    For that, Windows must accept inbound TCP connections on ports {ports}
    ({port} and the next ones, used only when it is busy), on domain and
    private networks. The rule is by port, not by program, so it keeps
    working when ax is updated or run from a USB stick. ax only accepts
    devices from the local network and needs no internet.
    Run assess-firewall.cmd as administrator once per computer, or deploy the
    same rule with a group policy.
  readme_undo: "To undo it:"
  script_done: "Wrote {script} and {note}."

portable:
  short: Run ax from a USB stick or any folder, with its settings and data
  long: |-
    A portable copy keeps the program, its settings (ax.yaml next to it) and
    its data (data/, with the vault) in one folder, for example on a USB
    stick: plug it into any computer and run ax from there. Without a
    subcommand, says whether this copy is portable.
  init_short: Make a portable copy of ax in a folder
  init_long: |-
    Copies ax into the folder and writes ax.yaml next to it, so that copy
    keeps its settings and data inside the folder. --copy-vault also copies
    the vault in use (an encrypted vault stays encrypted).
  init_example: |-
    ax portable init E:\ax
    ax portable init E:\ax --copy-vault
  flag_copy_vault: Copy the vault in use into the portable copy
  exists: "{path} already exists: that folder already holds a portable ax."
  vault_copied: "Copied the vault «{name}»."
  done: "Portable copy ready in {dir}. Run {exe} from there: it uses only the settings and data in that folder."
  is_portable: "This is a portable copy: settings in {dir}, data in {data}."
  not_portable: "This copy uses the settings of this computer ({path}). `ax portable init <folder>` makes a portable one."
