find:
  short: Search students, classes, exams and sessions
  long: |-
    Finds what matches the text the way a forgiving search would: case,
    accents, spaces and dashes do not count, and a typo or two is fine.
    Without text it lists everything that passes the filters.
      --type      student, class, exam or session (repeat it or separate with commas)
      --class     students of a class, sessions of a class
      --exam      sessions of an exam, students who took it
      --since     from a date on (YYYY-MM-DD)
      --below     a score under this percentage
      --flagged   students with strikes or integrity signals
  example: |-
    ax find garcia
    ax find --class 3B --below 50
    ax find --flagged --since 2026-09-01
    ax find algebra --type session --csv
  flag_type: "Only these kinds: student, class, exam, session"
  flag_class: Only this class
  flag_exam: Only this exam (id or title)
  flag_since: Only from this date on (YYYY-MM-DD)
  flag_below: Only scores below this percentage
  flag_flagged: Only students with strikes or signals
  bad_date: "{date} is not a date; write it as YYYY-MM-DD."
  none: "Nothing matches “{q}”."
  header: "Type|ID|Name|Details"
  type:
    student: student
    class: class
    exam: exam
    session: session
  exam_detail:
    one: "{n} session"
    other: "{n} sessions"
  average: "average {pct} %"
  flagged_note: "{exam}: {strikes} strikes, {signals} signals"

