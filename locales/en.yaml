    Builds the gradebook of a class: one row per student, one column per exam
    they sat (the latest attempt, as a percentage) and their average. It
    prints a table, or writes CSV or an Excel workbook (.xlsx).
  example: |-
    ax gradebook 3B
    ax gradebook 3B --out 3B.xlsx
    ax gradebook 3B --csv > 3B.csv
  flag_xlsx: Write an Excel workbook (needs --out)
  xlsx_needs_out: "An Excel workbook needs a file: add --out grades.xlsx."
  wrote: "Wrote {n} students × {exams} exams to {file}."
