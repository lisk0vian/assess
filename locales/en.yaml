    long: |-
      Creates a vault in a folder (by default .assess-vault in the current
      folder, which ax then uses whenever you work here or below). It is
      encrypted with a password unless --no-encrypt or the vault.encrypt
      setting say otherwise; you also get a recovery key, shown once.
      If you ever forget the password and lose the recovery key, create a new
      vault and carry on: the old one is never touched.
    example: |-
      ax vault init
