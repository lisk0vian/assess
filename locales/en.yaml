backup:
  short: Back up the whole vault into one file
  long: |-
    Copies the vault (exams, classes, session archives and the database) into
    one ZIP file, by default in the vault's backups folder. It works while an
    exam is running. An encrypted vault's backup stays encrypted: restoring it
    needs the same password or the recovery key.
    A backup is also made automatically each time a session closes (see the
    vault.keep_backups setting).
  example: |-
    ax backup
    ax backup --out E:\copias\
  flag_out: File or folder to write the backup to (default the vault's backups folder)
  done: "Backup written: {file} ({size})."
  encrypted_note: The backup is encrypted like the vault; keep the password or the recovery key with it.
  list_short: List the vault's backups
  none: No backups yet.

restore:
  short: Restore a backup into a new vault folder
  long: |-
    Unpacks a backup made with `ax backup` (or an automatic one) into a new,
    empty folder and adds it to your vaults. The vault in use is not touched;
    switch to the restored one with --use or `ax vault use`.
  example: ax restore backups/backup-2026-10-25-101500.zip D:\vaults\restored --use
  done: "Restored into {dir} as the vault «{name}»."
  encrypted_note: It is encrypted; it opens with the password it had, or with its recovery key.

