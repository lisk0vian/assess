# Caso: examen de programación con el perfil más estricto.
# - proctoring: strict → las mismas protecciones que standard, con tolerancia
#   mínima: salir 3 s = aviso y −1 min; copiar o capturar = aviso y pregunta
#   anulada; el segundo aviso anula el examen. Solo ordenador.
# - Código en enunciados y opciones, una pregunta con tiempo propio.
# - result_visibility: review → al cerrar la sesión el alumno ve la corrección.
format: assess/v1
id: programacion-go
title: "Programación en Go — Fundamentos"
language: es
duration: 30m
result_visibility: review

instructions: |
  Este examen usa el modo **estricto**:

  - Se hace en **pantalla completa** y desde un **ordenador**.
  - Las opciones se leen **pasando el cursor** por encima (o con Tab).
  - Salir de la pestaña, copiar o capturar la pantalla cuenta como aviso.
    **El primer aviso es tu única advertencia: con el segundo se anula.**

  Lee el código con calma: los detalles importan.

order:
  shuffle_questions: true
  shuffle_options: true

proctoring:
  profile: strict

items:
  - question: q001
  - question: q002
  - question: q003
  - question: q004
  - question: q005
  - question: q006

branding:
  accent: "#0e7c86"
