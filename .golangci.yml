version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # Cleanup on paths that already return an error (or after a successful read).
        - (*database/sql.Tx).Rollback
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*github.com/lisk0vian/assess/internal/storage/sqlite.DB).Close
        - (*os.File).Close
        - (io.Closer).Close
        - (net.Listener).Close
        # Temp dir and rehearsal server cleanup where the error changes nothing.
        - os.RemoveAll
        - (*net/http.Server).Close
        - syscall.CloseHandle
    gosec:
      excludes:
        # ax reads and writes user-chosen exam folders by design; exam files are
        # meant to be shared, so 0644/0755 is intended (private/ uses 0600/0700).
        - G301
        - G304
        - G306
        - G703 # data/exam paths come from the user's own flags by design
        # Unchecked errors are errcheck's job (with its exclusions above).
        - G104
    misspell:
      ignore-rules:
        - nto # Spanish ("Cuánto")
        - comparte # Spanish ("Comparte el código")
        - configuracion # Spanish ("configuración")
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
