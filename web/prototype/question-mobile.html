<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assess · Pregunta (móvil)</title>
<script src="theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@600;700;800&family=Sofia+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="components.css">
<style>
:root { --sheet-pad: 18px; }
html, body { width: 390px; height: 844px; overflow: hidden; }
body { position: relative; font-size: 16px; }
header.cells { position: absolute; inset: 0 0 auto 0; height: 60px; grid-template-columns: 1fr 132px; }
header .cell { padding: 0 14px; gap: 3px; }
header .wordmark { font-size: 24px; }
header .clock { font-size: 34px; }
.strip { position: absolute; left: 12px; right: 12px; top: 72px; }
.stack { position: absolute; left: 12px; top: 112px; width: 366px; height: 630px; }
.stack > .sheet { height: 100%; padding-bottom: 0; }
.stack__under--near { transform: translate(6px, 16px) rotate(1.4deg); }
.stack__peek { top: auto; bottom: 3px; writing-mode: horizontal-tb; }
.record { grid-template-columns: .9fr .8fr 1.5fr; }
.record__cell { padding: 12px 8px 10px 0; gap: 2px; }
.record__value { font-size: 15px; }
.record__num { font-size: 24px; }
.answer { display: grid; gap: 8px; margin-top: 16px; }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 76px; }
</style></head><body>
<header class="cells">
  <div class="cell"><span class="wordmark">ASSESS</span><span class="label">Introducción a la IA</span></div>
  <div class="cell"><span class="label">Restante</span><span class="clock">32:14</span></div>
</header>
<div class="strip" style="--n:10" aria-label="Progreso: 7 de 10"><i class="done"></i><i class="done"></i><i class="flag"></i><i class="done"></i><i class="done"></i><i class="done"></i><i class="done cur"></i><i></i><i></i><i></i></div>
<div class="stack">

  <section class="sheet" aria-labelledby="q">

      <div class="record__cell"><span class="label">Pregunta</span><b class="record__num">07<em> / 10</em></b></div>
      <div class="record__cell"><span class="label">Valor</span><b class="record__value">1 punto</b></div>
      <div class="record__cell"><span class="label">Tipo</span><b class="record__value">Respuesta corta</b></div>
    </div>

  </section>
</div>
<nav class="bar"><button class="btn" aria-label="Índice de preguntas">7/10</button><button class="btn">Anterior</button><button class="btn btn--primary">Siguiente<svg class="icon"><use href="icons.svg#arrow-right"/></svg></button></nav>
