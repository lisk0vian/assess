<style>
/* Lienzo de diseño: la mesa de luz como tablero; los marcos son rejillas de celdas reales. */
:root{
  --bg:#e8e6e1;--surface:#f8f7f4;--surface-2:#f0efeb;--ink:#141414;--ink-2:#5b5a56;--rule:#cdcbc5;--rule-strong:#141414;
  --accent:#ec2a8a;--accent-ink:#a30e58;--inverse:#141414;--on-inverse:#f8f7f4;
  --body:"Sofia Sans",system-ui,sans-serif;--label:"Sofia Sans Extra Condensed","Arial Narrow",sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111110;--surface:#1c1c1a;--surface-2:#232321;--ink:#ecebe6;--ink-2:#a7a59f;--rule:#353431;--rule-strong:#bcbab4;--accent:#ff4fa3;--accent-ink:#ff7ab9;--inverse:#ecebe6;--on-inverse:#141413;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111110;--surface:#1c1c1a;--surface-2:#232321;--ink:#ecebe6;--ink-2:#a7a59f;--rule:#353431;--rule-strong:#bcbab4;--accent:#ff4fa3;--accent-ink:#ff7ab9;--inverse:#ecebe6;--on-inverse:#141413;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;display:flex;flex-direction:column}
::selection{background:var(--accent);color:var(--on-inverse)}
button{font:700 15px/1 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:var(--surface);border:1px solid var(--rule-strong);border-radius:0;height:34px;padding:0 12px;cursor:pointer}
button:hover{background:var(--surface-2)}
button[aria-pressed="true"]{background:var(--inverse);color:var(--on-inverse)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.bar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--rule-strong);position:relative;z-index:5}
header.bar h1{margin:0;font:800 24px/1 var(--label);letter-spacing:.06em;text-transform:uppercase}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#status{font-size:14px;color:var(--ink-2);margin-left:auto;font-variant-numeric:tabular-nums}
#status b{color:var(--ink)}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;cursor:grab;touch-action:none}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;width:8100px}
#world>*{position:absolute}
svg#arrows{left:0;top:0;overflow:visible;pointer-events:none}
.arrow{fill:none;stroke:var(--ink-2);stroke-width:3}
.arrow.key{stroke:var(--accent)}
.arrow.dash{stroke-dasharray:10 10}
.alabel{font:700 24px var(--mono);fill:var(--ink)}
.albg{fill:var(--bg)}
.zone h2{margin:0 0 12px;font:800 118px/.95 var(--label);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.zone p{margin:0;max-width:72ch;font-size:32px;line-height:1.35;color:var(--ink-2)}
.cost{display:flex;gap:44px;margin-top:22px;font-size:27px;line-height:1.35;color:var(--ink)}
.cost div{max-width:56ch}.cost b{font:800 27px var(--label);letter-spacing:.1em;text-transform:uppercase;display:block}
.frame{margin:0}
.frame figcaption{display:flex;align-items:center;gap:18px;height:46px;font:700 26px/1 var(--label);letter-spacing:.1em;text-transform:uppercase}
.frame figcaption span{font:400 18px var(--mono);letter-spacing:0;text-transform:none;color:var(--ink-2)}
.frame figcaption button{margin-left:auto;height:36px}
.frame canvas{display:block;background:var(--surface);box-shadow:0 1px 2px rgba(20,20,20,.08),0 18px 40px -8px rgba(20,20,20,.2)}
.panel{background:var(--surface);padding:34px 36px;box-shadow:0 1px 2px rgba(20,20,20,.08),0 18px 40px -8px rgba(20,20,20,.2)}
.panel h3{margin:0 0 20px;font:800 44px/1 var(--label);letter-spacing:.06em;text-transform:uppercase;border-bottom:2px solid var(--rule-strong);padding-bottom:12px}
.panel table{border-collapse:collapse;width:100%;font-size:21px;line-height:1.3}
.panel th{text-align:left;font:700 18px var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);padding:7px 14px 7px 0;border-bottom:1px solid var(--rule-strong)}
.panel td{padding:9px 14px 9px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.panel code{font:400 19px var(--mono)}
.sw{display:inline-block;width:30px;height:18px;border:1px solid var(--rule-strong);vertical-align:-3px}
.comp{margin:0 0 18px}.comp canvas{display:block}
.comp figcaption{font-size:18px;color:var(--ink-2);margin:0 0 6px;line-height:1.25}
.comp figcaption b{color:var(--ink);font:700 19px var(--label);letter-spacing:.12em;text-transform:uppercase}
.glyphs{font:400 28px/1.5 var(--mono);word-spacing:.2em}
.glyphs div{border-bottom:1px solid var(--rule);padding:6px 0}.glyphs small{display:block;font:400 18px var(--body);color:var(--ink-2)}
#focus{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
#focus[hidden]{display:none}
#focus .fbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--rule-strong)}
#focus .fbar strong{font:800 20px var(--label);letter-spacing:.08em;text-transform:uppercase}
#focus .fbar span{font-size:14px;color:var(--ink-2);min-width:0}
#fwrap{flex:1;min-height:0;display:grid;place-items:center;padding:12px;overflow:auto}
#fcanvas{display:block;box-shadow:0 18px 40px -8px rgba(20,20,20,.35)}
@media (prefers-reduced-motion:no-preference){#world.ease{transition:transform .28s cubic-bezier(.16,1,.3,1)}}
</style>

<header class="bar">
  <h1>Assess · Terminal</h1>
  <div class="grp" role="group" aria-label="Ir a">

</header>
<div id="stage"><div id="world"><svg id="arrows" width="1" height="1" aria-hidden="true"><defs>

<section id="focus" hidden aria-label="Prototipo operable">

</section>
